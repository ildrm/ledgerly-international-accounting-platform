name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: ledgerly
          POSTGRES_USER: ledgerly_migrator
          POSTGRES_PASSWORD: ledgerly_migrator_dev
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ledgerly_migrator -d ledgerly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8.2-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ledgerly_runtime:ledgerly_runtime_dev@localhost:5432/ledgerly
      MIGRATION_DATABASE_URL: postgresql://ledgerly_migrator:ledgerly_migrator_dev@localhost:5432/ledgerly
      REDIS_URL: redis://localhost:6379
      SESSION_PEPPER: ledgerly-ci-session-pepper-at-least-32-characters
      LOG_LEVEL: fatal
      LEDGERLY_SEED_PROFILE: deterministic-development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Enable pinned package manager
        run: corepack enable
      - name: Install dependencies without lock drift
        run: pnpm install --frozen-lockfile
      - name: Bootstrap least-privilege runtime role
        env:
          PGPASSWORD: ledgerly_migrator_dev
        run: psql -h localhost -U ledgerly_migrator -d ledgerly -v ON_ERROR_STOP=1 -f infra/docker/postgres/init/000_roles.sql
      - name: Apply checksummed migrations twice
        run: pnpm db:migrate && pnpm db:migrate
      - name: Seed deterministic accounting fixture twice
        run: pnpm db:seed && pnpm db:seed
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit and contract tests
        run: pnpm test
      - name: Real PostgreSQL integration tests
        run: pnpm test:integration
      - name: Production build
        run: pnpm build
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
