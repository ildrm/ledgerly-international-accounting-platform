name: ledgerly

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ledgerly
      POSTGRES_USER: ledgerly_migrator
      POSTGRES_PASSWORD: ledgerly_migrator_dev
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerly_migrator -d ledgerly"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ledgerly_local
      MINIO_ROOT_PASSWORD: ledgerly_local_secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]

volumes:
  postgres-data:
  redis-data:
  minio-data:
